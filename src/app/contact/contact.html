<div class="contact-container">
  <h2>Kontakt</h2>
  <p>Masz pytania, pomysł na własny projekt lub potrzebujesz niestandardowego wydruku 3D? Napisz do mnie bezpośrednio lub skorzystaj z formularza!</p>
  
  <div class="contact-direct">
    <p><strong>Nasz Email:</strong> xonshop.contact@gmail.com</p>
  </div>

  <form (ngSubmit)="sendMessage()" class="contact-form">
    <div class="form-group">
      <label for="name">Twoje Imię</label>
      <input type="text" id="name" [(ngModel)]="nameInput" name="name" required autocomplete="off">
    </div>

    <div class="form-group">
      <label for="email">Twój Adres Email</label>
      <input type="email" id="email" [(ngModel)]="emailInput" name="email" required autocomplete="off">
    </div>

    <div class="form-group">
      <label for="message">Wiadomość</label>
      <textarea id="message" [(ngModel)]="messageInput" name="message" rows="5" required></textarea>
    </div>

    <button type="submit" class="submit-btn">Wyślij wiadomość</button>
  </form>
</div>
